<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
</head>

<body>
  <h1>MAVLink WebSocket Example</h1>
  <div>
    <video id="video_up" width="320" height="240" autoplay playsinline muted controls></video>
    <video id="video_down" width="320" height="240" autoplay playsinline muted controls></video>
  </div>
  <br />
  <button onclick="startViewer()" id="start_video_button">start video</button>
  <button onclick="connect()" id="connect_button">connect</button>
  <button onclick="disconnect()" id="disconnect_button">disconnect</button>
  <button onclick="showImageQueuePopup(imageQueue)" id="show_image_queue_button">show image queue</button>
  <br />
  <p>Status: <span id="status">disconnected</span></p>
  <div id="messages"></div>

  <script>
    class ImageQueue {
      constructor(maxLength = 10) {
        this.maxLength = maxLength;
        this.frames = [];   // newest at end
      }

      push(frame) {
        this.frames.push(frame);
        if (this.frames.length > this.maxLength) {
          const old = this.frames.shift();
          if (old.close) old.close();
        }
      }

      getAll() {
        return [...this.frames];
      }
    }
    let status = "disconnected";
    let ws = null;
    let delta_time = 0;
    let last_time = null;
    const imageQueue = new ImageQueue(10);
    function connect() {
      if (ws) {
        console.log("WebSocket already connected");
        return;
      }
      ws = new WebSocket("ws://localhost:8000/ws");
      last_time = performance.now();
      document.getElementById("status").innerText = "connected";
      ws.onmessage = function (event) {
        delta_time = performance.now() - last_time;
        last_time = performance.now();
        const msgDiv = document.getElementById("messages");
        const message = JSON.parse(event.data);
        // console.log("Received message:", message);
        msgDiv.innerHTML = `<span>${delta_time.toFixed(
          2
        )} ms</span><pre>${JSON.stringify(message, null, 2)}</pre>`;
      };
      ws.onopen = function () {
        console.log("WebSocket connection established");
        document.getElementById("connect_button").disabled = true;
        document.getElementById("disconnect_button").disabled = false;
      };
      ws.onclose = function () {
        console.log("WebSocket connection closed");
        document.getElementById("status").innerText = "disconnected";
        document.getElementById("connect_button").disabled = false;
        document.getElementById("disconnect_button").disabled = true;
      };
    }
    function disconnect() {
      if (ws) {
        ws.close();
        ws = null;
        document.getElementById("status").innerText = "disconnected";
      }
    }
    async function startViewer() {
      const video_up = document.getElementById("video_up");
      const video_down = document.getElementById("video_down");
      const resp = await fetch(`/get_ephemeral_viewer`);
      const data = await resp.json();
      const { appId, publisherSessionId, viewerSessionId, trackName } = data;

      const pc = new RTCPeerConnection({ iceServers: [{ urls: ["stun:stun.l.google.com:19302"] }] });
      pc.addTransceiver("video", { direction: "recvonly" });
      pc.addTransceiver("video", { direction: "recvonly" });
      pc.addTransceiver("audio", { direction: "recvonly" });
      let streamSet = false


      pc.ontrack = (event) => {
        const [stream] = event.streams;
        const track = event.track;

        console.log("🎥 Received track:", track.id, track.kind);
        const receivers = pc.getReceivers().filter(r => r.track && r.track.readyState === "live");

        if (!video_up.srcObject && receivers.length >= 1) {
          video_up.srcObject = stream;
        } else if (!video_down.srcObject && receivers.length >= 2) {
          video_down.srcObject = stream;
          setupWebCodecsProcessor(track);
        }
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      console.log("Local description set with offer.");

      // Wait for ICE gathering
      await new Promise(resolve => {
        if (pc.iceGatheringState === "complete") resolve();
        else pc.onicegatheringstatechange = () => {
          if (pc.iceGatheringState === "complete") resolve();
        };
      });
      console.log("ICE gathering complete.");

      // Send offer to CF SFU for viewer
      const payload = {
        sessionDescription: { type: pc.localDescription.type, sdp: pc.localDescription.sdp },
        tracks: [
          { location: "remote", sessionId: publisherSessionId, trackName: "cam_up" },
          { location: "remote", sessionId: publisherSessionId, trackName: "cam_down" },
        ],
      };

      const trackResp = await fetch(
        `/tracks/${viewerSessionId}`,
        { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }
      );
      const trackData = await trackResp.json();
      const answer = trackData.sessionDescription;
      console.log("Received answer from SFU:", answer);
      await pc.setRemoteDescription(answer);
      console.log("✅ Viewer connected and playing track!");
    }
    function setupWebCodecsProcessor(track) {
      const processor = new MediaStreamTrackProcessor({ track });
      const reader = processor.readable.getReader();

      async function readFrame() {
        const result = await reader.read();
        if (result.done) {
          console.log("Track reader done");
          return;
        }
        const videoFrame = result.value;
        const isMarked = checkMark(videoFrame);
        if (isMarked) {
          const pngBlob = await frameToPNG(videoFrame);
          imageQueue.push(pngBlob);
        }
        console.log(`Frame received. Marked: ${isMarked}`);
        videoFrame.close();
        readFrame();
      }
      readFrame();
    }
    function checkMark(videoFrame) {
      const width = 5;
      const height = 5;

      // 4 bytes per pixel (R, G, B, A)
      const buf = new Uint8Array(width * height * 4);

      videoFrame.copyTo(buf, {
        format: "RGBA",
        rect: { x: 0, y: 0, width, height },
        layout: [
          {
            offset: 0,
            length: buf.length,
            stride: width * 4,   // 4 bytes per pixel
          },
        ],
      });

      // Check if every pixel is pure green (0,255,0)
      for (let i = 0; i < buf.length; i += 4) {
        const r = buf[i];
        const g = buf[i + 1];
        const b = buf[i + 2];
        console.log(r, g, b);
        // alpha (buf[i+3]) we ignore

        if (r <= 10 || g >= 240 || b <= 10) {
          return false;
        }
      }

      return true;
    }
    async function frameToPNG(frame) {
      const bitmap = await createImageBitmap(frame);

      const canvas = new OffscreenCanvas(bitmap.width, bitmap.height);
      const ctx = canvas.getContext("2d");

      ctx.drawImage(bitmap, 0, 0);
      const blob = await canvas.convertToBlob({ type: "image/png" });

      bitmap.close();
      return blob;
    }
    async function showImageQueuePopup(queue) {
      // Remove old popup if exists
      const old = document.getElementById("imageQueuePopup");
      if (old) old.remove();

      // Create container
      const popup = document.createElement("div");
      popup.id = "imageQueuePopup";
      popup.style.cssText = `
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 99999;
  `;

      // Create inner panel
      const panel = document.createElement("div");
      panel.style.cssText = `
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    max-width: 90vw;
    max-height: 90vh;
    overflow: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, 150px);
    gap: 10px;
  `;

      // Convert each blob → image element
      for (const blob of queue.frames) {
        const url = URL.createObjectURL(blob);
        const img = document.createElement("img");
        img.src = url;
        img.style.cssText = `
      width: 150px;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
      border: 1px solid #ccc;
    `;
        panel.appendChild(img);
      }

      // Close on click outside panel
      popup.addEventListener("click", (e) => {
        if (e.target === popup) popup.remove();
      });

      popup.appendChild(panel);
      document.body.appendChild(popup);
    }
    bouy = [
      {
        color : "red",
        lattitude: 47.39774,
        longitude: 8.545594,
      },
      {
        color : "green",
        lattitude: 47.397800,
        longitude: 8.545650,
      },

    ]
  </script>
</body>

</html>
